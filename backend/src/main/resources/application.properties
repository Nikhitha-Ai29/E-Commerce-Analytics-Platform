# ============================================================
# Application Configuration
# No credentials are stored here. Local credentials use Application Default
# Credentials; Cloud Run uses its attached service account.
# ============================================================

# Server
server.port=${PORT:8080}

# Google Cloud Spanner
spring.cloud.gcp.spanner.project-id=${SPANNER_PROJECT_ID:hybrid-task-473204-g4}
spring.cloud.gcp.spanner.instance-id=${SPANNER_INSTANCE_ID:analytics-instance}
spring.cloud.gcp.spanner.database=${SPANNER_DATABASE:global_analytics}

# Google Cloud credentials use Application Default Credentials.

# File upload limits (for CSV uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS — allow Vite dev server ports (3001 is used when 3000 is occupied)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# Logging
logging.level.com.analytics=INFO
